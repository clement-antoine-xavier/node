[workspace]
resolver = "3"
members = ["crates/proto", "crates/net", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
proto = { path = "crates/proto" }
net = { path = "crates/net" }

# Protocol
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

# Runtime / async
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
futures = "0.3"

# HTTP / gRPC
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# Middleware
tower = { version = "0.5", features = [
    "retry",
    "timeout",
    "limit",
    "load",
    "filter",
    "buffer",
    "util",
    "make",
    "discover",
    "balance",
] }
tower-http = { version = "0.7", features = ["trace", "limit", "timeout"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Config / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
